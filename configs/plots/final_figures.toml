# Final findings and appendix artifacts from completed fresh experiment grids.
[output]
root = "results/figure_assets/findings"

[groups.overview]
studies = ["unified_foundation_baseline"]
entrypoint = "tfm_finetuning.plots.overview.pattern_analysis:generate_pattern_analysis"
config = "configs/plots/overview/pattern_analysis.toml"
assets = [
  "default_overview/normalized_score_distributions.pdf",
  "default_overview/critical_difference_overall.pdf",
  "default_overview/sft_dataset_wins.pdf",
  "default_overview/fine_tuning_gain_variance.pdf",
  "default_overview/metric_gain_agreement.pdf",
  "default_overview/preprocessing_gain_difference.pdf",
  "default_overview/checkpoint_selection_epochs.pdf",
  "default_overview/association_heatmap_combined.pdf",
  "default_overview/checkpoint_collapses_compact.pdf",
  "default_overview/default_overview_dataset_table.tex",
  "default_overview/metric_gains_binary.pdf",
  "default_overview/metric_gains_multiclass.pdf",
  "default_overview/metric_gains_regression.pdf",
  "default_overview/checkpoint_selection_gap.pdf",
  "default_overview/association_heatmap_epoch100_combined.pdf",
]

[groups.hpo]
studies = ["foundation_regular_hpo_representative", "unified_foundation_baseline"]
entrypoint = "tfm_finetuning.plots.overview.hpo_analysis:generate_hpo_analysis"
config = "configs/plots/overview/hpo_analysis.toml"
assets = [
  "hyperparameter_tuning/hpo_test_gain_vs_default.pdf",
  "hyperparameter_tuning/hpo_selections.tex",
]

[groups.mitra_pipeline]
studies = ["mitra_original_pipeline", "mitra_adapted_pipeline"]
entrypoint = "tfm_finetuning.plots.overview.mitra_pipeline_analysis:generate_mitra_pipeline_analysis"
config = "configs/plots/overview/mitra_pipeline_analysis.toml"
assets = [
  "appendix/mitra_pipeline_comparison.pdf",
]

[groups.transformations]
studies = ["distribution_shift_subsample", "distribution_shift_label_noise", "distribution_shift_feature_order", "distribution_shift_numeric_scale", "distribution_shift_feature_order_alignment", "distribution_shift_numeric_scale_alignment", "distribution_shift_spurious_correlation", "distribution_shift_heavy_tail_diamonds", "distribution_shift_contextual_scale", "distribution_shift_heavy_tail", "distribution_shift_class_prior_majority_downsampling", "distribution_shift_class_prior_context_only_downsampling"]
entrypoint = "tfm_finetuning.plots.transformations.transformation_analysis:generate_transformation_findings"
config = "configs/plots/transformations/transformation_analysis.toml"
assets = [
  "transformation_studies/subsample_pooled_scores_and_gains.pdf",
  "transformation_studies/label_noise_aggregate_scores.pdf",
  "transformation_studies/label_noise_selected_dataset_gains.pdf",
  "transformation_studies/spurious_correlation_aggregate_scores.pdf",
  "transformation_studies/spurious_correlation_dataset_checkpoint_gains.pdf",
  "transformation_studies/representation_alignment_normalized_scores.pdf",
  "transformation_studies/class_prior_majority_downsampling_class_accuracy.pdf",
  "transformation_studies/heavy_tail_pooled_scores_and_gains_horizontal.pdf",
  "transformation_studies/diamonds_tail_mitigation.pdf",
  "transformation_studies/contextual_scale_pooled_scores_and_gains.pdf",
  "transformation_studies/heavy_tail_contamination_mitigation.pdf",
]

[groups.transfer]
studies = ["dataset_transfer", "dataset_transfer_data_budget", "dataset_transfer_balanced_budget_classification", "dataset_transfer_balanced_budget_regression", "dataset_transfer_source_only_eval_classification", "dataset_transfer_source_only_eval_regression"]
entrypoint = "tfm_finetuning.plots.transfer.transfer_analysis:generate"
config = "configs/plots/transfer/transfer_analysis.toml"
assets = [
  "cross_dataset_transfer/source_initialization_by_target_data.pdf",
  "cross_dataset_transfer/transfer_training_order_comparison.pdf",
  "cross_dataset_transfer/source_only_checkpoint_transfer.pdf",
]

[groups.natural_domains]
studies = ["dataset_transfer_natural_domain", "dataset_transfer_natural_domain_training"]
entrypoint = "tfm_finetuning.plots.transfer.natural_domain_analysis:generate"
config = "configs/plots/transfer/natural_domain_analysis.toml"
assets = [
  "cross_dataset_transfer/natural_domain_route_matched_transfer.pdf",
]

[groups.retention]
studies = ["dataset_transfer", "dataset_transfer_target_controls", "dataset_transfer_learned_retention_eval"]
entrypoint = "tfm_finetuning.plots.transfer.retention_table:generate"
config = "configs/plots/transfer/retention.toml"
assets = [
  "cross_dataset_transfer/learned_capability_changes.tex",
]

[groups.resources]
entrypoint = "tfm_finetuning.plots.thesis_resource_analysis:generate"
config = "configs/plots/thesis_resource_analysis.toml"
assets = [
  "resources/resource_table.tex",
]
