study: introductory
datasets:
- churn
models:
- name: tabpfnv2_5
  config: configs/finetuning/default_tabpfnv2_5_foundation.toml
parameters:
  preprocessing:
    path: foundation_model.preprocessing_protocol
    values:
    - native
    - shared
split:
  protocol: fixed_split_repeated_seeds
  folds:
  - 0
  repeats:
  - 0
