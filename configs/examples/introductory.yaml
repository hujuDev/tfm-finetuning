study: introductory
datasets:
- churn
models:
- name: tabpfnv2_5
  config: configs/finetuning/default_tabpfnv2_5.toml
parameters:
  preprocessing:
    path: finetune.preprocessing_protocol
    values:
    - native
    - shared
split:
  protocol: fixed_split_repeated_seeds
  folds:
  - 0
  repeats:
  - 0
  samples:
  - 0
  seeds:
  - 0
  validation_seed: 0
settings:
  finetune.epochs: 1
  finetune.context_size: 1024
  finetune.early_stopping: false
  finetune.baseline_only: false
  finetune.final_eval_checkpoint: best
  finetune.validation_split_ratio: 0.1
  finetune.validation_split_seed: 0
  finetune.test_context_includes_validation_data: false
wandb:
  project: tfm-finetuning
  mode: disabled
