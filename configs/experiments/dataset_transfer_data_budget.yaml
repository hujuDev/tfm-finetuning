study: dataset_transfer_data_budget
title: 'Dataset Transfer: Target-Data Budget'
category: transfer
models:
- name: tabpfnv25
  config: configs/finetuning/default_tabpfnv2_5.toml
- name: tabiclv2
  config: configs/finetuning/default_tabicl_v2.toml
- name: mitra
  config: configs/finetuning/default_mitra.toml
axes:
  preprocessing:
  - value: shared
    settings:
      finetune.preprocessing_protocol: shared
  targetBudgetProducer:
  - value: target_only
    settings:
      dataset_transfer.route_id: target_budget_target_only
  - value: satimage_initialized
    settings:
      dataset_transfer.route_id: target_budget_satimage_initialized
  targetTrainRows:
  - value: 64
    settings:
      dataset_transfer.target_train_rows: 64
  - value: 256
    settings:
      dataset_transfer.target_train_rows: 256
  - value: 1024
    settings:
      dataset_transfer.target_train_rows: 1024
  - value: 4096
    settings:
      dataset_transfer.target_train_rows: 4096
  - value: 16384
    settings:
      dataset_transfer.target_train_rows: 16384
split:
  protocol: fixed_split_repeated_seeds
  seeds:
  - 0
  - 1
  - 2
  validation_seed: 0
  folds:
  - 0
  repeats:
  - 0
  samples:
  - 0
settings:
  preprocess.steps:
  - clamp_train_pool
  preprocess.clamp_train_pool.max_size: 200000
  data.backend: tabarena_openml_task_wrapper
  evaluation.backend: tabarena_aligned
  finetune.preprocessing_protocol: shared
  finetune.epochs: 100
  finetune.use_lr_scheduler: false
  finetune.early_stopping: false
  finetune.patience: 16
  finetune.min_delta: 0.0001
  finetune.final_eval_checkpoint: best
  finetune.keep_intermediate_checkpoints: false
  finetune.test_eval_interval_epochs: 0
  finetune.test_context_includes_validation_data: true
  finetune.validation_split_ratio: 0.1
  finetune.validation_split_seed: 0
  finetune.ignore_pretraining_limits: true
  finetune.resource_fallback_policy: strict
  dataset_transfer.enabled: true
  dataset_transfer.family: dataset_transfer_data_budget
  dataset_transfer.execution_mode: train
  dataset_transfer.updates_per_dataset: 100
  dataset_transfer.nested_row_seed: 0
  dataset_transfer.dependency_updates_per_dataset: 100
  dataset_transfer.dependency_row_budget_per_dataset: 50000
  dataset_transfer.dependency_nested_row_seed: 0
  dataset_transfer.context_policy: target_train_plus_validation
  dataset_transfer.strict_resource_semantics: true
groups:
- name: covertype_nested_budget_80gb_5h_mem64g_main
  resource: gpu_80gb_5h_mem64g
  datasets:
  - covertype
