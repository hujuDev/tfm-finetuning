study: preprint_tabpfn_v3
title: TabPFN-3 and TabPFN-3.5 on the 55-dataset panel
category: overview
axes:
  preprocessing:
  - value: shared
    settings:
      finetune.preprocessing_protocol: shared
split:
  protocol: cv_auto
  seeds:
  - 0
  - 1
  - 2
  validation_seed: 0
  samples:
  - 0
groups:
- name: any_gpu_main
  resource: gpu_any_5h
  datasets:
  - Another-Dataset-on-used-Fiat-500
  - Fitness_Club
  - Is-this-a-good-customer
  - MIC
  - Marketing_Campaign
  - QSAR_fish_toxicity
  - airfoil_self_noise
  - anneal
  - blood-transfusion-service-center
  - concrete_compressive_strength
  - credit-g
  - diabetes
  - hazelnut-spread-contaminant-detection
  - healthcare_insurance_expenses
  - maternal_health_risk
  - qsar-biodeg
  - website_phishing
  models:
  - name: tabpfnv3
    config: configs/finetuning/default_tabpfnv3.toml
    settings:
      finetune.model_id: tabpfn_v3
      finetune.classifier_checkpoint: models/tabpfn-v3-classifier-v3_default.ckpt
      finetune.regressor_checkpoint: models/tabpfn-v3-regressor-v3_default.ckpt
  - name: tabpfnv35
    config: configs/finetuning/default_tabpfnv3_5.toml
    settings:
      finetune.model_id: tabpfn_v3_5
      finetune.classifier_checkpoint: models/tabpfn-v3.5-20260909.safetensors
      finetune.regressor_checkpoint: models/tabpfn-v3.5-20260909.safetensors
  - name: tabpfnv35fast
    config: configs/finetuning/default_tabpfnv3_5_fast.toml
    settings:
      finetune.model_id: tabpfn_v3_5_fast
      finetune.classifier_checkpoint: models/tabpfn-v3.5-fast-20260909.safetensors
      finetune.regressor_checkpoint: models/tabpfn-v3.5-fast-20260909.safetensors
  settings:
    preprocess.steps:
    - clamp_train_pool
    preprocess.clamp_train_pool.max_size: 200000
    data.backend: tabarena_openml_task_wrapper
    evaluation.backend: tabarena_aligned
    finetune.n_estimators_finetune: 2
    finetune.n_estimators_validation: 2
    finetune.n_estimators_final_inference: 2
    finetune.baseline_only: false
    finetune.epochs: 100
    finetune.early_stopping: false
    finetune.keep_intermediate_checkpoints: false
    finetune.test_eval_interval_epochs: 0
    finetune.final_eval_checkpoint: best
    finetune.test_context_includes_validation_data: true
    finetune.validation_split_ratio: 0.1
    finetune.validation_split_seed: 0
    finetune.train_max_rows: 200000
    finetune.inference_context_max_rows: 50000
    finetune.resource_fallback_policy: oom_context_retry
    finetune.oom_retry_context_sizes:
    - 5000
    - 2500
    - 1000
    - 500
    finetune.grad_clip: 1
    finetune.ignore_pretraining_limits: true
    finetune.save_best_val_checkpoint: false
    finetune.test_context_comparison.enabled: false
    finetune.use_lr_scheduler: true
    finetune.warmup_proportion: 0.1
