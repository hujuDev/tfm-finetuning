study: dataset_transfer
title: 'Dataset Transfer: Multi-Dataset Schedules'
category: transfer
models:
- name: tabpfnv25
  config: configs/finetuning/default_tabpfnv2_5.toml
- name: tabiclv2
  config: configs/finetuning/default_tabicl_v2.toml
- name: mitra
  config: configs/finetuning/default_mitra.toml
split:
  protocol: fixed_split_repeated_seeds
  seeds:
  - 0
  - 1
  - 2
  validation_seed: 0
  folds:
  - 0
  repeats:
  - 0
  samples:
  - 0
settings:
  preprocess.steps:
  - clamp_train_pool
  preprocess.clamp_train_pool.max_size: 200000
  data.backend: tabarena_openml_task_wrapper
  evaluation.backend: tabarena_aligned
  finetune.preprocessing_protocol: shared
  finetune.epochs: 100
  finetune.use_lr_scheduler: false
  finetune.early_stopping: false
  finetune.patience: 16
  finetune.min_delta: 0.0001
  finetune.final_eval_checkpoint: best
  finetune.keep_intermediate_checkpoints: false
  finetune.test_eval_interval_epochs: 0
  finetune.test_context_includes_validation_data: true
  finetune.validation_split_ratio: 0.1
  finetune.validation_split_seed: 0
  finetune.ignore_pretraining_limits: true
  finetune.resource_fallback_policy: strict
  dataset_transfer.enabled: true
  dataset_transfer.family: dataset_transfer
  dataset_transfer.execution_mode: train
  dataset_transfer.updates_per_dataset: 100
  dataset_transfer.row_budget_per_dataset: 50000
  dataset_transfer.nested_row_seed: 0
  dataset_transfer.context_policy: target_train_plus_validation
  dataset_transfer.strict_resource_semantics: true
groups:
- name: finance_target_only_any_5h_main
  resource: gpu_any_5h
  datasets:
  - credit-g
  axes:
    preprocessing:
    - value: shared
      settings:
        finetune.preprocessing_protocol: shared
    transferRoute:
    - value: target_compute_matched
      settings:
        dataset_transfer.route_id: target_compute_matched
- name: finance_multidataset_40gb_5h_main
  resource: gpu_40gb_5h
  datasets:
  - credit-g
  axes:
    preprocessing:
    - value: shared
      settings:
        finetune.preprocessing_protocol: shared
    transferRoute:
    - value: pooled_target_sources
      settings:
        dataset_transfer.route_id: pooled_target_sources
    - value: pooled_sources_then_target
      settings:
        dataset_transfer.route_id: pooled_sources_then_target
    - value: sequential_bank_then_heloc_then_target
      settings:
        dataset_transfer.route_id: sequential_bank_then_heloc_then_target
    - value: sequential_heloc_then_bank_then_target
      settings:
        dataset_transfer.route_id: sequential_heloc_then_bank_then_target
- name: remote_covertype_full_80gb_5h_mem64g_main
  resource: gpu_80gb_5h_mem64g
  datasets:
  - covertype
  axes:
    preprocessing:
    - value: shared
      settings:
        finetune.preprocessing_protocol: shared
    transferRoute:
    - value: target_compute_matched
      settings:
        dataset_transfer.route_id: target_compute_matched
    - value: pooled_target_satimage
      settings:
        dataset_transfer.route_id: pooled_target_satimage
    - value: sequential_satimage_then_target
      settings:
        dataset_transfer.route_id: sequential_satimage_then_target
    - value: pooled_target_satimage_segment_ablation
      settings:
        dataset_transfer.route_id: pooled_target_satimage_segment_ablation
    - value: sequential_satimage_then_segment_then_target
      settings:
        dataset_transfer.route_id: sequential_satimage_then_segment_then_target
    - value: sequential_segment_then_satimage_then_target
      settings:
        dataset_transfer.route_id: sequential_segment_then_satimage_then_target
- name: remote_satimage_target_only_any_5h_main
  resource: gpu_any_5h
  datasets:
  - satimage
  axes:
    preprocessing:
    - value: shared
      settings:
        finetune.preprocessing_protocol: shared
    transferRoute:
    - value: target_compute_matched
      settings:
        dataset_transfer.route_id: target_compute_matched
- name: remote_satimage_from_covertype_80gb_5h_mem64g_main
  resource: gpu_80gb_5h_mem64g
  datasets:
  - satimage
  axes:
    preprocessing:
    - value: shared
      settings:
        finetune.preprocessing_protocol: shared
    transferRoute:
    - value: pooled_target_covertype
      settings:
        dataset_transfer.route_id: pooled_target_covertype
    - value: sequential_covertype_then_target
      settings:
        dataset_transfer.route_id: sequential_covertype_then_target
    - value: pooled_target_covertype_segment_ablation
      settings:
        dataset_transfer.route_id: pooled_target_covertype_segment_ablation
    - value: sequential_covertype_then_segment_then_target
      settings:
        dataset_transfer.route_id: sequential_covertype_then_segment_then_target
    - value: sequential_segment_then_covertype_then_target
      settings:
        dataset_transfer.route_id: sequential_segment_then_covertype_then_target
