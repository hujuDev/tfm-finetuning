study: distribution_shift_heavy_tail_calibration
title: 'Distribution Shift: Heavy-Tail Calibration'
section: section2
models:
- name: tabpfnv25
  config: configs/finetuning/default_tabpfnv2_5_foundation.toml
  settings:
    foundation_model.model_id: tabpfn_v2_5
    foundation_model.regressor_checkpoint: models/tabpfn-v2.5-regressor-v2.5_default.ckpt
settings:
  preprocess.steps:
  - heavy_tail_contamination
  - clamp_train_pool
  preprocess.clamp_train_pool.max_size: 200000
  data.backend: tabarena_openml_task_wrapper
  evaluation.backend: tabarena_aligned
  foundation_model.preprocessing_protocol: shared
  foundation_model.n_estimators_validation: 2
  foundation_model.baseline_only: true
  foundation_model.evaluation_splits:
  - val
  foundation_model.test_eval_interval_epochs: 0
  foundation_model.test_context_includes_validation_data: true
  foundation_model.test_context_comparison.enabled: false
  foundation_model.inference_context_max_rows: 50000
  foundation_model.ignore_pretraining_limits: true
groups:
- name: standard_80gb_zero_main
  resource: gpu_80gb_5h
  datasets:
  - miami_housing
  - houses
  axes:
    heavyTailRate:
    - value: '0'
      settings:
        preprocess.heavy_tail_contamination.rate: 0
    heavyTailMagnitudeIqr:
    - value: '10'
      settings:
        preprocess.heavy_tail_contamination.magnitude_iqr: 10
  split:
    protocol: fixed_split_repeated_seeds
    seeds:
    - 0
    - 1
    - 2
    validation_seed: 0
    folds:
    - 0
    repeats:
    - 0
    samples:
    - 0
- name: standard_80gb_nonzero_main
  resource: gpu_80gb_5h
  datasets:
  - miami_housing
  - houses
  axes:
    heavyTailRate:
    - value: '0.01'
      settings:
        preprocess.heavy_tail_contamination.rate: 0.01
    - value: '0.05'
      settings:
        preprocess.heavy_tail_contamination.rate: 0.05
    - value: '0.15'
      settings:
        preprocess.heavy_tail_contamination.rate: 0.15
    - value: '0.30'
      settings:
        preprocess.heavy_tail_contamination.rate: 0.3
    - value: '0.60'
      settings:
        preprocess.heavy_tail_contamination.rate: 0.6
    - value: '1'
      settings:
        preprocess.heavy_tail_contamination.rate: 1
    heavyTailMagnitudeIqr:
    - value: '10'
      settings:
        preprocess.heavy_tail_contamination.magnitude_iqr: 10
    - value: '25'
      settings:
        preprocess.heavy_tail_contamination.magnitude_iqr: 25
    - value: '50'
      settings:
        preprocess.heavy_tail_contamination.magnitude_iqr: 50
  split:
    protocol: fixed_split_repeated_seeds
    seeds:
    - 0
    - 1
    - 2
    validation_seed: 0
    folds:
    - 0
    repeats:
    - 0
    samples:
    - 0
