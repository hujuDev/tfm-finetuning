study: dataset_transfer_target_controls
title: 'Dataset Transfer: Source-Only Total-Steps Controls'
category: transfer
models:
- name: tabpfnv25
  config: configs/finetuning/default_tabpfnv2_5.toml
- name: tabiclv2
  config: configs/finetuning/default_tabicl_v2.toml
- name: mitra
  config: configs/finetuning/default_mitra.toml
axes:
  preprocessing:
  - value: shared
    settings:
      finetune.preprocessing_protocol: shared
  targetControlProducer:
  - value: target_only_300_steps
    settings:
      dataset_transfer.route_id: target_control_300_steps
split:
  protocol: fixed_split_repeated_seeds
  seeds:
  - 0
  - 1
  - 2
  validation_seed: 0
  folds:
  - 0
  repeats:
  - 0
  samples:
  - 0
settings:
  preprocess.steps:
  - clamp_train_pool
  preprocess.clamp_train_pool.max_size: 200000
  data.backend: tabarena_openml_task_wrapper
  evaluation.backend: tabarena_aligned
  finetune.preprocessing_protocol: shared
  finetune.epochs: 100
  finetune.use_lr_scheduler: false
  finetune.early_stopping: false
  finetune.patience: 16
  finetune.min_delta: 0.0001
  finetune.final_eval_checkpoint: best
  finetune.keep_intermediate_checkpoints: false
  finetune.test_eval_interval_epochs: 0
  finetune.test_context_includes_validation_data: true
  finetune.validation_split_ratio: 0.1
  finetune.validation_split_seed: 0
  finetune.ignore_pretraining_limits: true
  finetune.resource_fallback_policy: strict
  dataset_transfer.enabled: true
  dataset_transfer.family: dataset_transfer_target_controls
  dataset_transfer.execution_mode: train
  dataset_transfer.updates_per_dataset: 100
  dataset_transfer.row_budget_per_dataset: 50000
  dataset_transfer.nested_row_seed: 0
  dataset_transfer.target_only_budget: 300_target_steps
  dataset_transfer.context_policy: target_train_plus_validation
  dataset_transfer.strict_resource_semantics: true
groups:
- name: source_only_target_controls_any_5h_main
  resource: gpu_any_5h
  datasets:
  - credit-g
  - Bank_Customer_Churn
  - heloc
  - segment
