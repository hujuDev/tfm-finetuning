study: dataset_transfer_learned_retention_eval
title: 'Dataset Transfer: Learned Bank--Covertype Capability Retention'
section: section3
models:
- name: tabpfnv25
  config: configs/finetuning/default_tabpfnv2_5_foundation.toml
- name: tabiclv2
  config: configs/finetuning/default_tabicl_v2.toml
- name: mitra
  config: configs/finetuning/default_mitra.toml
split:
  protocol: fixed_split_repeated_seeds
  seeds:
  - 0
  - 1
  - 2
  validation_seed: 0
  folds:
  - 0
  repeats:
  - 0
  samples:
  - 0
settings:
  data.backend: tabarena_openml_task_wrapper
  evaluation.backend: tabarena_aligned
  foundation_model.preprocessing_protocol: shared
  foundation_model.use_lr_scheduler: false
  foundation_model.early_stopping: false
  foundation_model.test_context_includes_validation_data: true
  foundation_model.validation_split_ratio: 0.1
  foundation_model.validation_split_seed: 0
  foundation_model.ignore_pretraining_limits: true
  foundation_model.resource_fallback_policy: strict
  dataset_transfer.enabled: true
  dataset_transfer.family: dataset_transfer_source_only_eval
  dataset_transfer.execution_mode: checkpoint_eval
  dataset_transfer.route_id: learned_retention_probe
  dataset_transfer.evaluation_mode: frozen_checkpoint_target_icl
  dataset_transfer.evaluation_targets:
  - Bank_Customer_Churn
  - covertype
  dataset_transfer.context_policy: target_train_plus_validation
  dataset_transfer.gradient_updates_allowed: false
  dataset_transfer.checkpoint_family: dataset_transfer_learned_retention
  dataset_transfer.checkpoint_role: terminal
  dataset_transfer.dependency_updates_per_dataset: 100
  dataset_transfer.dependency_row_budget_per_dataset: 50000
  dataset_transfer.dependency_nested_row_seed: 0
  dataset_transfer.dependency_training_recipe:
    epochs: 100
    use_lr_scheduler: false
    early_stopping: false
    patience: 16
    min_delta: 0.0001
  dataset_transfer.dependency_data_recipe:
    data_backend: tabarena_openml_task_wrapper
    evaluation_backend: tabarena_aligned
    validation_split_ratio: 0.1
    validation_split_seed: 0
    preprocess_steps:
    - clamp_train_pool
    clamp_train_pool_max_size: 200000
  dataset_transfer.strict_resource_semantics: true
groups:
- name: bank_then_covertype_dual_eval_80gb_5h_mem64g_main
  resource: gpu_80gb_5h_mem64g
  datasets:
  - covertype
  axes:
    preprocessing:
    - value: shared
      settings:
        foundation_model.preprocessing_protocol: shared
    retentionCheckpoint:
    - value: sequential_bank_then_covertype
      settings:
        dataset_transfer.source_checkpoint_label: sequential_bank_then_covertype
        dataset_transfer.checkpoint_route: sequential_bank_then_covertype
        dataset_transfer.checkpoint_origin: covertype
  targets:
  - Bank_Customer_Churn
  - covertype
- name: covertype_then_bank_dual_eval_40gb_5h_main
  resource: gpu_80gb_5h_mem64g
  datasets:
  - Bank_Customer_Churn
  axes:
    preprocessing:
    - value: shared
      settings:
        foundation_model.preprocessing_protocol: shared
    retentionCheckpoint:
    - value: sequential_covertype_then_bank
      settings:
        dataset_transfer.source_checkpoint_label: sequential_covertype_then_bank
        dataset_transfer.checkpoint_route: sequential_covertype_then_bank
        dataset_transfer.checkpoint_origin: Bank_Customer_Churn
  targets:
  - Bank_Customer_Churn
  - covertype
- name: pooled_bank_covertype_dual_eval_80gb_5h_mem64g_main
  resource: gpu_80gb_5h_mem64g
  datasets:
  - covertype
  axes:
    preprocessing:
    - value: shared
      settings:
        foundation_model.preprocessing_protocol: shared
    retentionCheckpoint:
    - value: pooled_bank_covertype
      settings:
        dataset_transfer.source_checkpoint_label: pooled_bank_covertype
        dataset_transfer.checkpoint_route: pooled_bank_covertype
        dataset_transfer.checkpoint_origin: covertype
  targets:
  - Bank_Customer_Churn
  - covertype
