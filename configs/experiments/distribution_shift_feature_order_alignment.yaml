study: distribution_shift_feature_order_alignment
title: 'Distribution Shift: Feature Order and inference alignment'
section: section2
models:
- name: tabpfnv25
  config: configs/finetuning/default_tabpfnv2_5_foundation.toml
  settings:
    foundation_model.model_id: tabpfn_v2_5
    foundation_model.classifier_checkpoint: models/tabpfn-v2.5-classifier-v2.5_default-2.ckpt
    foundation_model.regressor_checkpoint: models/tabpfn-v2.5-regressor-v2.5_default.ckpt
- name: tabiclv2
  config: configs/finetuning/default_tabicl_v2.toml
  settings:
    foundation_model.model_id: tabicl_v2
    foundation_model.classifier_checkpoint: tabicl-classifier-v2-20260212.ckpt
    foundation_model.regressor_checkpoint: tabicl-regressor-v2-20260212.ckpt
- name: mitra
  config: configs/finetuning/default_mitra.toml
  settings:
    foundation_model.model_id: mitra
    foundation_model.classifier_checkpoint: autogluon/mitra-classifier
    foundation_model.regressor_checkpoint: autogluon/mitra-regressor
axes:
  featureOrderFitState:
  - value: canonical
    settings:
      preprocess.shuffle_feature_order.fit_state: canonical
  - value: permuted
    settings:
      preprocess.shuffle_feature_order.fit_state: permuted
settings:
  preprocess.steps:
  - shuffle_feature_order
  - clamp_train_pool
  preprocess.clamp_train_pool.max_size: 200000
  data.backend: tabarena_openml_task_wrapper
  evaluation.backend: tabarena_aligned
  foundation_model.preprocessing_protocol: shared
  foundation_model.n_estimators_finetune: 2
  foundation_model.n_estimators_validation: 2
  foundation_model.n_estimators_final_inference: 2
  foundation_model.baseline_only: false
  foundation_model.epochs: 100
  foundation_model.early_stopping: true
  foundation_model.patience: 16
  foundation_model.min_delta: 0.0001
  foundation_model.keep_intermediate_checkpoints: false
  foundation_model.test_eval_interval_epochs: 0
  foundation_model.final_eval_checkpoint: best
  foundation_model.test_context_includes_validation_data: true
  foundation_model.test_context_comparison.enabled: false
  foundation_model.validation_split_ratio: 0.1
  foundation_model.validation_split_seed: 0
  foundation_model.train_max_rows: 200000
  foundation_model.inference_context_max_rows: 50000
  foundation_model.ignore_pretraining_limits: true
  foundation_model.resource_fallback_policy: oom_context_retry
  foundation_model.oom_retry_context_sizes:
  - 5000
  - 2500
  - 1000
  - 500
groups:
- name: standard_80gb_main
  resource: gpu_80gb_2d
  datasets:
  - splice
  - wine_quality
  - jm1
  split:
    protocol: fixed_split_repeated_seeds
    seeds:
    - 0
    - 1
    - 2
    validation_seed: 0
    folds:
    - 0
    repeats:
    - 0
    samples:
    - 0
- name: small_any_main
  resource: gpu_any_5h
  datasets:
  - maternal_health_risk
  - anneal
  split:
    protocol: cross_validation_repeated_seeds
    seeds:
    - 0
    - 1
    - 2
    validation_seed: 0
    folds:
    - 0
    - 1
    - 2
    repeats:
    - 0
    samples:
    - 0
