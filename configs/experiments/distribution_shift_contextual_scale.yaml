study: distribution_shift_contextual_scale
title: 'Distribution Shift: Contextual Scale'
category: transformations
models:
- name: tabpfnv25
  config: configs/finetuning/default_tabpfnv2_5.toml
  settings:
    finetune.model_id: tabpfn_v2_5
    finetune.classifier_checkpoint: models/tabpfn-v2.5-classifier-v2.5_default-2.ckpt
    finetune.regressor_checkpoint: models/tabpfn-v2.5-regressor-v2.5_default.ckpt
- name: tabiclv2
  config: configs/finetuning/default_tabicl_v2.toml
  settings:
    finetune.model_id: tabicl_v2
    finetune.classifier_checkpoint: tabicl-classifier-v2-20260212.ckpt
    finetune.regressor_checkpoint: tabicl-regressor-v2-20260212.ckpt
- name: mitra
  config: configs/finetuning/default_mitra.toml
  settings:
    finetune.model_id: mitra
    finetune.classifier_checkpoint: autogluon/mitra-classifier
    finetune.regressor_checkpoint: autogluon/mitra-regressor
axes:
  contextualScaleCondition:
  - value: scale_1x_no_unit_column
    settings:
      preprocess.contextual_scale.condition: scale_1x_no_unit_column
  - value: scale_1x_with_unit_column
    settings:
      preprocess.contextual_scale.condition: scale_1x_with_unit_column
  - value: scale_sx_no_unit_column
    settings:
      preprocess.contextual_scale.condition: scale_sx_no_unit_column
  - value: scale_sx_with_unit_column
    settings:
      preprocess.contextual_scale.condition: scale_sx_with_unit_column
split:
  protocol: fixed_split_repeated_seeds
  seeds:
  - 0
  - 1
  - 2
  validation_seed: 0
  folds:
  - 0
  repeats:
  - 0
  samples:
  - 0
settings:
  preprocess.steps:
  - clamp_train_pool
  - contextual_scale
  preprocess.clamp_train_pool.max_size: 200000
  preprocess.contextual_scale.feature_strategy: importance
  preprocess.contextual_scale.feature_count: calibrated
  preprocess.contextual_scale.feature_count_by_dataset:
    houses: 1
    sdss17: 1
  preprocess.contextual_scale.group_count: 3
  preprocess.contextual_scale.scale_spread: calibrated
  preprocess.contextual_scale.scale_spread_by_dataset:
    houses: 3
    sdss17: 3
  data.backend: tabarena_openml_task_wrapper
  evaluation.backend: tabarena_aligned
  finetune.preprocessing_protocol: shared
  finetune.n_estimators_finetune: 2
  finetune.n_estimators_validation: 2
  finetune.n_estimators_final_inference: 2
  finetune.baseline_only: false
  finetune.epochs: 100
  finetune.early_stopping: true
  finetune.patience: 16
  finetune.min_delta: 0.0001
  finetune.keep_intermediate_checkpoints: false
  finetune.test_eval_interval_epochs: 0
  finetune.final_eval_checkpoint: best
  finetune.test_context_includes_validation_data: true
  finetune.test_context_comparison.enabled: false
  finetune.validation_split_ratio: 0.1
  finetune.validation_split_seed: 0
  finetune.train_max_rows: 200000
  finetune.inference_context_max_rows: 50000
  finetune.ignore_pretraining_limits: true
  finetune.resource_fallback_policy: oom_context_retry
  finetune.oom_retry_context_sizes:
  - 5000
  - 2500
  - 1000
  - 500
groups:
- name: all_80gb_main
  resource: gpu_80gb_2d
  datasets:
  - sdss17
  - houses
