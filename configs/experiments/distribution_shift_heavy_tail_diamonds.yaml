study: distribution_shift_heavy_tail_diamonds
title: 'Distribution Shift: Heavy-Tail Diamonds Follow-up'
category: transformations
models:
- name: tabpfnv25
  config: configs/finetuning/default_tabpfnv2_5.toml
  settings:
    finetune.model_id: tabpfn_v2_5
    finetune.regressor_checkpoint: models/tabpfn-v2.5-regressor-v2.5_default.ckpt
axes:
  targetTailMode:
  - value: none
    settings:
      preprocess.target_transform.mode: none
  - value: winsor_p01_p99
    settings:
      preprocess.target_transform.mode: winsor_p01_p99
  - value: robust_log1p
    settings:
      preprocess.target_transform.mode: robust_log1p
split:
  protocol: fixed_split_repeated_seeds
  seeds:
  - 0
  - 1
  - 2
  validation_seed: 0
  folds:
  - 0
  repeats:
  - 0
  samples:
  - 0
settings:
  preprocess.steps:
  - target_transform
  - clamp_train_pool
  preprocess.clamp_train_pool.max_size: 200000
  data.backend: tabarena_openml_task_wrapper
  evaluation.backend: tabarena_aligned
  finetune.preprocessing_protocol: shared
  finetune.n_estimators_finetune: 2
  finetune.n_estimators_validation: 2
  finetune.n_estimators_final_inference: 2
  finetune.baseline_only: false
  finetune.epochs: 50
  finetune.early_stopping: false
  finetune.patience: 50
  finetune.min_delta: 0.0001
  finetune.keep_intermediate_checkpoints: false
  finetune.test_eval_interval_epochs: 0
  finetune.final_eval_checkpoint: best
  finetune.test_context_includes_validation_data: true
  finetune.test_context_comparison.enabled: false
  finetune.validation_split_ratio: 0.1
  finetune.validation_split_seed: 0
  finetune.train_max_rows: 200000
  finetune.inference_context_max_rows: 50000
  finetune.ignore_pretraining_limits: true
  finetune.resource_fallback_policy: oom_context_retry
  finetune.oom_retry_context_sizes:
  - 5000
  - 2500
  - 1000
  - 500
groups:
- name: diamonds_80gb_main
  resource: gpu_80gb_2d
  datasets:
  - diamonds
