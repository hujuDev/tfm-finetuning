study: distribution_shift_heavy_tail_diamonds
title: 'Distribution Shift: Heavy-Tail Diamonds Follow-up'
section: section2
models:
- name: tabpfnv25
  config: configs/finetuning/default_tabpfnv2_5_foundation.toml
  settings:
    foundation_model.model_id: tabpfn_v2_5
    foundation_model.regressor_checkpoint: models/tabpfn-v2.5-regressor-v2.5_default.ckpt
axes:
  targetTailMode:
  - value: none
    settings:
      preprocess.target_transform.mode: none
  - value: winsor_p01_p99
    settings:
      preprocess.target_transform.mode: winsor_p01_p99
  - value: robust_log1p
    settings:
      preprocess.target_transform.mode: robust_log1p
split:
  protocol: fixed_split_repeated_seeds
  seeds:
  - 0
  - 1
  - 2
  validation_seed: 0
  folds:
  - 0
  repeats:
  - 0
  samples:
  - 0
settings:
  preprocess.steps:
  - target_transform
  - clamp_train_pool
  preprocess.clamp_train_pool.max_size: 200000
  data.backend: tabarena_openml_task_wrapper
  evaluation.backend: tabarena_aligned
  foundation_model.preprocessing_protocol: shared
  foundation_model.n_estimators_finetune: 2
  foundation_model.n_estimators_validation: 2
  foundation_model.n_estimators_final_inference: 2
  foundation_model.baseline_only: false
  foundation_model.epochs: 50
  foundation_model.early_stopping: false
  foundation_model.patience: 50
  foundation_model.min_delta: 0.0001
  foundation_model.keep_intermediate_checkpoints: false
  foundation_model.test_eval_interval_epochs: 0
  foundation_model.final_eval_checkpoint: best
  foundation_model.test_context_includes_validation_data: true
  foundation_model.test_context_comparison.enabled: false
  foundation_model.validation_split_ratio: 0.1
  foundation_model.validation_split_seed: 0
  foundation_model.train_max_rows: 200000
  foundation_model.inference_context_max_rows: 50000
  foundation_model.ignore_pretraining_limits: true
  foundation_model.resource_fallback_policy: oom_context_retry
  foundation_model.oom_retry_context_sizes:
  - 5000
  - 2500
  - 1000
  - 500
groups:
- name: diamonds_80gb_main
  resource: gpu_80gb_2d
  datasets:
  - diamonds
