study: overview_hpo_representative
title: Regular HPO Representative
category: overview
models:
- name: tabpfnv2
  config: configs/finetuning/default_tabpfnv2.toml
  settings:
    finetune.model_id: tabpfn_v2
    finetune.classifier_checkpoint: models/tabpfn-v2-classifier.ckpt
    finetune.regressor_checkpoint: models/tabpfn-v2-regressor.ckpt
- name: tabpfnv25
  config: configs/finetuning/default_tabpfnv2_5.toml
  settings:
    finetune.model_id: tabpfn_v2_5
    finetune.classifier_checkpoint: models/tabpfn-v2.5-classifier-v2.5_default-2.ckpt
    finetune.regressor_checkpoint: models/tabpfn-v2.5-regressor-v2.5_default.ckpt
- name: tabiclv2
  config: configs/finetuning/default_tabicl_v2.toml
  settings:
    finetune.model_id: tabicl_v2
    finetune.classifier_checkpoint: tabicl-classifier-v2-20260212.ckpt
    finetune.regressor_checkpoint: tabicl-regressor-v2-20260212.ckpt
- name: mitra
  config: configs/finetuning/default_mitra.toml
  settings:
    finetune.model_id: mitra
    finetune.classifier_checkpoint: autogluon/mitra-classifier
    finetune.regressor_checkpoint: autogluon/mitra-regressor
axes:
  preprocessing:
  - value: native
    settings:
      finetune.preprocessing_protocol: native
parameters:
  learning_rate:
    path: finetune.learning_rate
    values:
    - 1.0e-05
    - 0.0001
    - 0.001
  weight_decay:
    path: finetune.weight_decay
    values:
    - 0.0
    - 0.01
    - 0.1
  context_size:
    path: finetune.context_size
    values:
    - 5000
    - 10000
    - 20000
split:
  protocol: cv_auto
  seeds:
  - 0
  - 1
  - 2
  validation_seed: 0
  samples:
  - 0
settings:
  preprocess.steps:
  - clamp_train_pool
  preprocess.clamp_train_pool.max_size: 200000
  data.backend: tabarena_openml_task_wrapper
  evaluation.backend: tabarena_aligned
  finetune.preprocessing_protocol: native
  finetune.n_estimators_finetune: 2
  finetune.n_estimators_validation: 2
  finetune.n_estimators_final_inference: 2
  finetune.baseline_only: false
  finetune.epochs: 100
  finetune.early_stopping: true
  finetune.patience: 16
  finetune.min_delta: 0.0001
  finetune.keep_intermediate_checkpoints: false
  finetune.test_eval_interval_epochs: 1
  finetune.final_eval_checkpoint: best
  finetune.save_best_val_checkpoint: false
  finetune.test_context_includes_validation_data: true
  finetune.validation_split_ratio: 0.1
  finetune.validation_split_seed: 0
  finetune.train_max_rows: 200000
  finetune.inference_context_max_rows: 50000
  finetune.ignore_pretraining_limits: true
  finetune.resource_fallback_policy: strict
  finetune.oom_retry_context_sizes: 'off'
  finetune.grad_clip: 1
  finetune.use_lr_scheduler: true
  finetune.warmup_proportion: 0.1
  finetune.mitra_finetune_interface: local_chunked
  finetune.mitra_scheduler_policy: cosine_warmup
groups:
- name: any_gpu_main
  resource: gpu_any_5h
  datasets:
  - airfoil_self_noise
  - anneal
  - maternal_health_risk
- name: medium_40gb_main
  resource: gpu_40gb_2d
  datasets:
  - houses
  - jm1
  - miami_housing
  - splice
  - wine_quality
- name: large_80gb_main
  resource: gpu_80gb_2d
  datasets:
  - covertype
  - diamonds
deduplicate_context_sizes: true
