# TabICLv2 default finetuning config template for the generic runner.
seed = 0

[finetune]
model_id = "tabicl_v2"
epochs = 100
learning_rate = 1e-5
weight_decay = 0.01
context_size = 10000
# CUDA OOM during TabICLv2 fine-tuning is retried by the runner with smaller
# effective context sizes. Reports record both this configured value and the
# successful effective value. Set oom_retry_context_sizes = "off" to disable,
# or provide a list such as [5000, 2500, 1000] for explicit fallbacks.
oom_retry_context_sizes = "off"
query_ratio = 0.2
n_estimators_finetune = 2
n_estimators_validation = 2
n_estimators_final_inference = 2
grad_clip = 1.0
use_lr_scheduler = true
warmup_proportion = 0.1
early_stopping = true
patience = 101
min_delta = 0.0
ignore_pretraining_limits = true
validation_split_ratio = 0.1
validation_split_seed = 0
test_context_includes_validation_data = false
final_eval_checkpoint = "best"
test_eval_interval_epochs = 0
save_best_val_checkpoint = false
preprocessing_protocol = "native"
classifier_checkpoint = "tabicl-classifier-v2-20260212.ckpt"
regressor_checkpoint = "tabicl-regressor-v2-20260212.ckpt"

[data]
seed = 0
path = ":data/tabarena/{dataset}"
split = "fold0_repeat0_sample0"

[evaluation]
backend = "tabarena_aligned"
device = "auto"

[wandb]
project = "tabpfn-finetune-eval"
mode = "online"
